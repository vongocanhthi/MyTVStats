[package]
name = "mytvstats"
version = "0.1.0"
description = "MyTV Google Play review statistics dashboard"
authors = ["VNPT Media"]
edition = "2021"
default-run = "mytvstats"

[lib]
name = "mytvstats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.13", features = ["json", "rustls", "form"], default-features = false }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
tokio-cron-scheduler = "0.13"
dotenvy = "0.15"
